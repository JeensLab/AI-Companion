name: Build

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build with Gradle
        run: ./gradlew build
      # The guitar tracks are not in the JAR: they are packed from music/ into the ready config/aicompanion/music structure,
      # and this artifact is what a release attaches. scripts/make-music-pack.sh is the only way the pack is built.
      - name: Build the guitar tracks pack
        run: ./scripts/make-music-pack.sh
      - name: Upload the guitar tracks pack
        uses: actions/upload-artifact@v4
        with:
          name: oleg-guitar-tracks
          path: oleg-guitar-tracks.zip
          retention-days: 30

  # The suite is split across separate machines: one shard per runner, each with its own world and disk.
  # `build` does not run GameTests, and a failed start can still exit 0 (a stale world lock did that once), so the
  # success line decides each job. A shard that flakes is retried once, as the single-run gate used to be.
  # The three long scenarios are left out of the shards: they would dominate one of them, and they catch what only
  # a long game shows (lost items, hangs after a reload). They run on their own machine, as they did before.
  endurance:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run the long scenarios
        timeout-minutes: 40
        run: |
          set -uo pipefail
          log="gametest-endurance.log"
          run_long() {
            local from=$(( $( [ -f "$log" ] && wc -l < "$log" || echo 0 ) + 1 ))
            local rc=0
            ./gradlew runGameTestServer -PgameTestMethods=twoHoursForestToolsStorageAndReturningPlayer,ninetyMinutesCaveFoodOreLightAndChangingPassage,hundredMinutesFullBagOrdersCancellationAndReloads --console=plain 2>&1 | tee -a "$log" || rc=$?
            tail -n +"$from" "$log" | grep -q "All 3 required tests passed" && [ "$rc" -eq 0 ]
          }
          run_long || { echo "::warning::the long scenarios failed once, retrying"; rm -rf run/world; run_long; }
      - name: Upload endurance log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-log-endurance
          path: gametest-endurance.log
          retention-days: 7
          if-no-files-found: ignore

  gametest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run GameTests shard ${{ matrix.shard }}
        timeout-minutes: 25
        run: |
          set -uo pipefail
          log="gametest-shard-${{ matrix.shard }}.log"
          run_shard() {
            local from=$(( $( [ -f "$log" ] && wc -l < "$log" || echo 0 ) + 1 ))
            local rc=0
            ./gradlew runGameTestShard${{ matrix.shard }} -PgameTestShards=${{ strategy.job-total }} --console=plain 2>&1 | tee -a "$log" || rc=$?
            tail -n +"$from" "$log" | grep -Eq "All ([0-9]+ )?required tests passed" && [ "$rc" -eq 0 ]
          }
          run_shard || { echo "::warning::GameTests shard ${{ matrix.shard }} failed once, retrying"; rm -rf "run/shard-${{ matrix.shard }}/world" "run/shard-${{ matrix.shard }}/logs/latest.log"; run_shard; }
      - name: Upload shard log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-log-shard-${{ matrix.shard }}
          path: gametest-shard-${{ matrix.shard }}.log
          retention-days: 7
          if-no-files-found: ignore

  # The shards must together cover the whole required pool: a shard that selected less, or passed fewer tests than it
  # selected, would otherwise leave a smaller suite looking green. Same checks as scripts/verify-fast.sh.
  gametest-sum:
    needs: gametest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download shard logs
        uses: actions/download-artifact@v4
        with:
          pattern: gametest-log-shard-*
          merge-multiple: true
      - name: Check that the shards cover the pool
        run: |
          set -uo pipefail
          shards=4 # the size of the gametest matrix
          fail=0
          pools=""
          sum=0
          for shard in $(seq 0 $(( shards - 1 ))); do
            log="gametest-shard-$shard.log"
            if [ ! -f "$log" ]; then echo "::error::shard $shard: no log"; fail=1; continue; fi
            selection=$(grep -ao "Game test selection: pool=[0-9]* selected=[0-9]* pool-required=[0-9]* selected-required=[0-9]*" "$log" | tail -1 || true)
            summary=$(grep -ao "All [0-9]* required tests passed" "$log" | tail -1 || true)
            pool=$(printf '%s\n' "$selection" | sed -n 's/.*pool-required=\([0-9]*\).*/\1/p')
            selected=$(printf '%s\n' "$selection" | sed -n 's/.*selected-required=\([0-9]*\).*/\1/p')
            passed=$(printf '%s\n' "$summary" | sed -n 's/All \([0-9]*\) required tests passed/\1/p')
            if [ -z "$pool" ] || [ -z "$selected" ] || [ -z "$passed" ]; then
              echo "::error::shard $shard: selection line '${selection:-none}', success line '${summary:-none}'"; fail=1; continue
            fi
            echo "shard $shard: pool-required $pool, selected-required $selected, passed $passed"
            if [ "$passed" -ne "$selected" ]; then echo "::error::shard $shard passed $passed of $selected"; fail=1; fi
            pools="$pools $pool"
            sum=$(( sum + selected ))
          done
          [ "$fail" -eq 0 ] || exit 1
          pool_required=$(printf '%s\n' $pools | head -1)
          if [ "$(printf '%s\n' $pools | sort -u | wc -l)" -ne 1 ]; then echo "::error::the shards saw different pools:$pools"; exit 1; fi
          if [ "$sum" -ne "$pool_required" ]; then echo "::error::the shards selected $sum required tests, the pool has $pool_required"; exit 1; fi
          echo "shards OK: selected-required $shards shards = pool-required $pool_required"
