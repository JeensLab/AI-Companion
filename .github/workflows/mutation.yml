name: Mutation spot check

# Not part of the main gate: each mutant is one real GameTest run, so the whole table takes a while.
# It breaks one rule at a time (tools/mutants.txt) and expects the test that owns the rule to fail.
on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mutation:
    runs-on: ubuntu-latest
    # Worst case is the baseline plus 13 mutants at the 20-minute cap each: (1 + 13) x 20 = 280 minutes, under this cap of 300.
    # Nothing else adds time: Gradle runs with --no-daemon and a timeout only destroys the client, with no stop step.
    # A run normally takes a fraction of that. Add a mutant, and this number moves with it (or split the table over two jobs).
    timeout-minutes: 300
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run the spot mutants
        run: bash scripts/mutation-spot.sh --all --timeout-min 20
      - name: Upload mutation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-logs
          path: build/diagnostics
          retention-days: 14
          if-no-files-found: ignore
